# Default configuration for gaitscreen.
#
# Every threshold in the system lives here -- nothing clinical is hardcoded in
# the modules. Values marked ILLUSTRATIVE are placeholders drawn from general
# geriatric-gait literature and MUST be reviewed against current clinical
# sources before any real deployment. This is a screening/trend tool, not a
# diagnostic instrument.

pose:
  # The ~30 MB model bundle is not committed to the repository; it is fetched on
  # first use and cached at model_path. Set auto_download false in air-gapped
  # deployments and place the file there yourself.
  #
  # Variants, if memory is tight (Streamlit Community Cloud allows ~1 GB): swap
  # `heavy` for `full` or `lite` in BOTH settings below. Lighter models trade
  # landmark accuracy for footprint, and foot landmark precision is what event
  # detection depends on -- prefer heavy unless the app is actually being killed.
  model_path: models/pose_landmarker_heavy.task
  model_url: https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task
  auto_download: true
  num_poses: 1
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  min_presence_confidence: 0.5

video:
  # Warn below this: general landmark/event-timing quality.
  fps_warn_below: 30
  # Stride-time variability needs finer temporal resolution than 30 fps can
  # give (see docs/limitations.md). Below this, CV is still computed but is
  # marked low-confidence.
  fps_variability_min: 50
  min_frame_height: 360
  max_frames: 0 # 0 = no limit

landmarks:
  # MediaPipe `visibility` is not a calibrated probability; treat as a soft
  # score. Samples below this are marked invalid and interpolated over.
  visibility_threshold: 0.5
  # Gaps longer than this are NOT interpolated; the series is split into
  # separate analysis segments instead.
  max_interpolation_gap_frames: 6

filter:
  # butterworth = zero-phase (filtfilt), the right default for offline video:
  # no phase lag, so event timing is preserved.
  # one_euro / kalman are causal and provided for a future real-time path.
  kind: butterworth
  butterworth:
    cutoff_hz: 6.0
    order: 4
  one_euro:
    min_cutoff_hz: 1.0
    beta: 0.02
    d_cutoff_hz: 1.0
  kalman:
    process_var: 1.0e-3
    measurement_var: 1.0e-2

segmentation:
  # zeni = coordinate-based (Zeni et al. 2008): heel-strike at max anterior
  # heel position relative to pelvis, toe-off at min anterior toe position.
  # ankle_velocity = fallback/cross-check heuristic.
  method: zeni
  fallback_method: ankle_velocity
  subframe_refine: true
  min_stride_time_s: 0.6
  max_stride_time_s: 2.5
  # A usable segment must be able to hold this many minimum-length
  # strides. Gating on max_stride_time instead would demand 2.5s of
  # unbroken tracking to measure a 0.9s stride.
  min_segment_strides: 2.0
  peak_prominence_frac: 0.15 # of signal range
  # Toe-off detection. foot_contact measures the end of ground contact from
  # foot speed; zeni infers it from the toe's anterior minimum, which is badly
  # conditioned because the pelvis keeps moving over a planted foot (see
  # segmentation/events.py). foot_contact falls back to zeni on its own when
  # the foot is not stationary during stance -- treadmill or moving-camera
  # footage -- so this only needs changing to force the old behaviour.
  toe_off_method: foot_contact
  # Foot speed below this counts as ground contact, in leg lengths per stride.
  # A planted foot measures near zero and a swinging foot around three, so the
  # separation is wide and the exact value is not critical.
  # Swept against pilot footage: at 0.9 the normal-paced clips measure 57-59%
  # of the cycle in stance against a textbook 60%, and the slow clips
  # correctly measure more. Lower values clip the start and end of contact.
  stance_speed_threshold: 0.9
  # A planted foot is not perfectly still -- it rolls heel to toe and the heel
  # lifts before the toe -- so speed flickers above the threshold mid-contact.
  # Gaps shorter than this share of a stride are closed before contacts are
  # measured; without it the contact count is unstable on identical footage.
  stance_merge_gap_fraction: 0.08
  # Contacts shorter than this share of a stride are noise, not steps.
  min_contact_fraction: 0.25
  # Plausible share of the gait cycle spent in stance, used to detect that the
  # stationary-foot assumption has failed, in which case toe-off falls back to
  # the zeni rule for both legs.
  min_stance_fraction: 0.40
  max_stance_fraction: 0.85
  # Acceleration/deceleration strides inflate variability -- drop them.
  exclude_strides_at_pass_edges: 1
  # A direction reversal (turn) ends a pass.
  turn_min_still_frames: 5

view:
  # Which plane the walk was recorded in. Everything downstream of segmentation
  # assumes the camera is side-on; a towards-camera clip breaks that assumption
  # without breaking the code, which is the dangerous case (see quality/view.py).
  #
  # The test compares how far the subject travels across the image against how
  # much their apparent size changes. Pilot footage: 0.016-0.085 for side-on
  # clips, 3.4 for the towards-camera clip, so both thresholds sit a factor of
  # ~6 away from anything observed.
  coronal_depth_ratio: 0.5
  sagittal_depth_ratio: 0.15
  # Below this much apparent-size change the subject is not moving in depth at
  # all, so the ratio has no meaning and is not computed. Walking in place
  # lands here.
  min_size_change: 0.5

coronal:
  # Measurement from a towards-camera clip. Only reached when quality/view.py
  # classifies the recording as coronal; see features/coronal.py for what such
  # a view can and cannot support.
  #
  # Direction of travel is read from whether the subject is growing or
  # shrinking in the frame. Smoothed over longer than a stride, or the scale
  # wobble from knee flexion reads as a change of direction.
  direction_smooth_s: 1.5
  # A turn is not gait. Runs shorter than this are turns or stumbles, and the
  # edges of the ones that survive are the subject decelerating into a turn and
  # accelerating out of it -- trimmed for the same reason the sagittal path
  # drops strides at pass edges.
  min_pass_s: 2.0
  pass_edge_trim_s: 0.7
  # Cadence is taken from each ankle independently and only accepted when the
  # two legs agree. They are one gait cycle, so a larger gap than this means
  # the estimate locked onto a harmonic on one side and is wrong, not noisy.
  max_leg_period_disagreement: 0.15

speed:
  # Gait speed is only reported when the subject genuinely translates across
  # a static frame. Treadmill / walking-in-place / camera-tracked footage
  # cannot yield speed and must be refused, not estimated.
  min_subject_translation_frac: 0.25 # of frame width
  max_camera_motion_frac: 0.03 # of frame width, cumulative
  camera_motion_sample_every: 5 # frames
  # Use only the middle portion of a pass (steady state).
  steady_state_trim_frac: 0.15

features:
  # Stride-time CV is unstable below this many strides; reported as null +
  # low-confidence rather than as a misleadingly precise number.
  min_strides_for_cv: 10
  min_cycles_for_session: 4
  angle_curve_points: 101 # 0-100% of cycle, 1% steps
  # No frontal camera in this setup, so lateral trunk sway is unavailable.
  # Sagittal anterior-posterior trunk lean is used as the substitute.
  trunk_sway_axis: sagittal_ap

quality:
  # Session data-quality score in [0, 1]; below threshold -> low-confidence,
  # excluded from trend baselines but still stored and reported.
  low_confidence_below: 0.6
  weights:
    landmark_visibility: 0.35
    valid_cycle_count: 0.30
    frame_rate: 0.15
    detection_rate: 0.10
    assistive_device: 0.10
  target_cycle_count: 10
  # MediaPipe cannot see a cane or walker -- it detects bodies, not objects.
  # `assistive_device` in session metadata is the authoritative signal; this
  # arm-swing heuristic is advisory only and may only LOWER confidence.
  assistive_device_heuristic:
    enabled: true
    # Reciprocal arm swing is suppressed and asymmetric when a cane is used.
    max_wrist_swing_frac_of_leg_length: 0.08
    min_arm_swing_asymmetry_ratio: 2.0

# Recording diagnostics: thresholds for the actionable feedback shown to
# whoever recorded the video. These are about the *recording*, not the person,
# so they are engineering limits rather than clinical ones -- but they were set
# from real pilot footage, not from first principles, and should be re-checked
# against your own camera and setting.
diagnostics:
  # Calibrated against the pilot test set (47 phone recordings, 832x464 to
  # 1920x1080, mostly 60 fps), not chosen from first principles. Where a
  # threshold could not be set from observed data that is noted inline.
  #
  # Subject size caps all downstream precision: landmark error in pixels is
  # roughly fixed, so relative error scales inversely with subject size. Pilot
  # clips ran 0.32-0.56 of frame height with legs of 86-324 px; the ones below
  # this line produced measurably less consistent event detection.
  min_subject_height_frac: 0.45
  min_leg_length_px: 110
  # Fraction of the clip in which every gait-critical joint is inside the frame.
  min_fully_visible_frac: 0.60
  # Estimated departure from a true side-on view, in degrees. At 30 degrees,
  # horizontal distances are foreshortened ~13%.
  max_sagittal_deviation_deg: 30
  # Lower-body visibility relative to torso visibility. Loose clothing shows up
  # here, and a hidden joint is estimated rather than absent -- confidently
  # wrong, which is worse than missing.
  min_lower_upper_visibility_ratio: 0.85
  # Frame-to-frame heel jitter as a fraction of leg length. Pilot footage that
  # tracked acceptably measured 0.000-0.003, so this sits well above the
  # observed-good range while still being reachable -- a limit of 0.020 could
  # never fire on any real recording and would be decoration.
  max_foot_jitter_norm: 0.008
  # A single-frame body displacement this large means the tracker changed person.
  max_identity_jump_norm: 0.50
  # Background back-and-forth beyond any steady pan, as a fraction of width.
  max_camera_shake_frac: 0.020
  # Strides wanted before variability is meaningful; mirrors
  # features.min_strides_for_cv but expressed as recording advice.
  min_strides_target: 10
  target_fps: 50

flagging:
  # --- Absolute thresholds (ILLUSTRATIVE -- review before deployment) ---
  absolute:
    gait_speed_mps:
      high_risk_below: 0.6
      moderate_risk_below: 1.0
    stride_time_cv_pct:
      high_risk_above: 5.0
      moderate_risk_above: 3.0
    step_length_asymmetry_pct:
      high_risk_above: 15.0
      moderate_risk_above: 8.0
    double_support_pct:
      high_risk_above: 30.0
      moderate_risk_above: 26.0

  # --- Personal trend check ---
  baseline:
    # SD from 3-5 sessions is very unstable, so a robust centre/spread is used
    # (median + 1.4826 * MAD) and a minimum session count is enforced.
    min_sessions: 5
    robust: true
    # Baseline window: whichever of these yields more sessions. Days alone
    # breaks down at monthly screening cadence (90 days = 3 sessions).
    window_days: 90
    window_min_sessions: 5
    exclude_low_confidence: true
  trend:
    deviation_sds: 1.5
    # Never flag noise: the deviation must also exceed the tool's own
    # test-retest error for that metric. ILLUSTRATIVE -- set from a real
    # repeatability study on your capture setup.
    minimum_detectable_change:
      gait_speed_mps: 0.05
      stride_time_cv_pct: 1.0
      step_length_asymmetry_pct: 3.0
      cadence_spm: 4.0
      double_support_pct: 2.0
      trunk_ap_sway_norm: 0.01
      # ILLUSTRATIVE, and less grounded than the rest: no repeatability study
      # exists for these two, because the tool has only just started measuring
      # them. Across the four passes of the one pilot coronal clip, step width
      # varied by 0.02 leg lengths and lateral sway by 0.002, so these sit just
      # above that within-session spread. Re-measure before relying on them.
      step_width_norm: 0.025
      trunk_lateral_sway_norm: 0.004
    # Only deterioration is a flag; improvement is not.
    direction_aware: true
    # Bias toward sensitivity: a single deviating session flags. A deviation
    # seen in 2 of the last 3 sessions escalates to `confirmed`.
    confirm_window: 3
    confirm_min_hits: 2

storage:
  db_path: data/gaitscreen.db
  artifacts_root: data/sessions
  # Raw landmarks are always kept: a longitudinal tool must be able to
  # re-derive old sessions when the algorithm changes, otherwise an upgrade
  # creates a fake trend break indistinguishable from real decline.
  keep_raw_landmarks: true

reporting:
  output_root: data/reports
  # Annotated playback: the source video with the tracked skeleton and detected
  # gait events drawn on. Exists so a viewer can confirm the skeleton followed
  # the right joints and the heel strikes landed at the right moments -- neither
  # of which a table of numbers can show.
  overlay:
    enabled: true
    max_width: 720 # downscaled for playback; analysis always uses full frames
    crf: 26 # libx264 quality, lower is better; 26 keeps clips small enough to stream
  metrics_to_plot:
    - gait_speed_mps
    - stride_time_cv_pct
    - step_length_asymmetry_pct
    - cadence_spm
    - double_support_pct
    - trunk_ap_sway_norm
    - step_width_norm
    - trunk_lateral_sway_norm
