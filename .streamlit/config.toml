# Committed deliberately: these settings need to apply to the deployment, not
# just to whoever ran the app last. Secrets go in .streamlit/secrets.toml, which
# is gitignored and set through the Streamlit Cloud Secrets panel instead.

[server]
# Default is 200 MB. A 60 fps side-on walk of 15-20 seconds is comfortably
# under that, but multi-pass recordings from a phone can exceed it.
maxUploadSize = 400

[browser]
gatherUsageStats = false

[theme]
# Keep in step with the tokens in app/ui.py.
base = "light"
primaryColor = "#0B6E63"
backgroundColor = "#F5F7F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#13232B"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
borderColor = "#E3E8EA"
baseRadius = "0.6rem"

[theme.sidebar]
backgroundColor = "#FFFFFF"
