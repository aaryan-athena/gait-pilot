[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaitscreen"
version = "0.1.0"
description = "Video-based gait screening and trend monitoring for elderly users"
requires-python = ">=3.11"
dependencies = [
    "mediapipe>=0.10.30",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=8.0", "streamlit>=1.30"]

[project.scripts]
gaitscreen = "gaitscreen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
